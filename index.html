<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DrawVision">
  <meta name="theme-color" content="#151719">
  <link rel="manifest" href="manifest.webmanifest">
  <title>DrawVision CAD Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151719;
      --panel: #202429;
      --panel-2: #292f35;
      --line: #3b444d;
      --text: #f1f4f7;
      --muted: #a8b0b8;
      --accent: #24b47e;
      --accent-2: #e1b955;
      --danger: #e45d5d;
      --blue: #5aa8ff;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100svh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #111416;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .title {
      min-width: 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .workspace {
      position: relative;
      min-height: 0;
      background:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        #171a1d;
      background-size: 24px 24px;
      touch-action: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .axis,
    .view-pad {
      position: absolute;
      display: grid;
      gap: 5px;
    }

    .axis {
      right: 10px;
      bottom: 72px;
      grid-template-columns: repeat(3, 34px);
    }

    .view-pad {
      right: 10px;
      top: 10px;
      grid-template-columns: repeat(3, 42px);
      z-index: 2;
    }

    .axis button,
    .view-pad button,
    .chip {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(32, 36, 41, .92);
      font-size: 13px;
      font-weight: 700;
    }

    .axis button.active,
    .view-pad button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bottom {
      border-top: 1px solid var(--line);
      background: #111416;
    }

    .command {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px 10px;
    }

    .command input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--panel);
      outline: none;
    }

    .primary {
      min-width: 62px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #071611;
      font-weight: 800;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid var(--line);
    }

    .tab {
      min-height: 52px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #15191d;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .tab.active {
      color: var(--text);
      background: var(--panel);
      box-shadow: inset 0 3px 0 var(--accent);
    }

    .drawer {
      position: absolute;
      inset: auto 0 0 0;
      max-height: min(58svh, 480px);
      border-top: 1px solid var(--line);
      background: rgba(21, 23, 25, .98);
      transform: translateY(100%);
      transition: transform .18s ease;
      z-index: 5;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .drawer.open { transform: translateY(0); }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .drawer-body {
      overflow: auto;
      padding: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .tool {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: left;
      padding: 8px 10px;
      font-weight: 700;
    }

    .tool span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      margin-bottom: 8px;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.28);
    }

    .name {
      min-width: 0;
      font-size: 14px;
      font-weight: 750;
    }

    .meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--muted);
      font-size: 11px;
      background: #15191d;
    }

    .properties {
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--panel);
    }

    .hud {
      position: absolute;
      left: 10px;
      top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100% - 20px);
      pointer-events: none;
    }

    .hud .chip {
      display: inline-grid;
      place-items: center;
      padding: 0 9px;
      color: var(--muted);
    }

    .selected {
      filter: drop-shadow(0 0 7px rgba(36,180,126,.9));
    }

    .snap-marker {
      fill: none;
      stroke: var(--accent-2);
      stroke-width: 2;
      pointer-events: none;
    }

    .snap-text {
      fill: var(--accent-2);
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
    }

    .view-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .credit {
      position: absolute;
      left: 10px;
      right: 118px;
      bottom: 74px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      pointer-events: none;
    }

    @media (min-width: 820px) {
      .app {
        grid-template-columns: 280px 1fr 320px;
        grid-template-rows: auto 1fr auto;
      }

      .topbar,
      .bottom {
        grid-column: 1 / -1;
      }

      .drawer {
        position: static;
        transform: none;
        max-height: none;
        border-top: 0;
        border-right: 1px solid var(--line);
      }

      .drawer:not(.open) { display: grid; }

      .workspace { grid-column: 2; }

      .view-pad {
        grid-template-columns: repeat(2, 44px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open tools">☰</button>
      <div class="title">DrawVision <span class="subtitle" id="status">Remembering DrawVision by Bob Loh</span></div>
      <button class="icon-btn" id="saveBtn" aria-label="Save model">⌁</button>
    </header>

    <section class="workspace" id="workspace" aria-label="Model viewport">
      <div class="hud" id="hud"></div>
      <div class="credit">Disclaimer by WQai: remembering DrawVision by Bob Loh.</div>
      <svg viewBox="0 0 390 620" role="img" aria-label="CAD canvas">
        <line x1="195" y1="0" x2="195" y2="620" stroke="#5aa8ff" stroke-width="1" opacity=".35"></line>
        <line x1="0" y1="310" x2="390" y2="310" stroke="#e45d5d" stroke-width="1" opacity=".35"></line>
        <text x="195" y="28" class="view-label" id="viewLabel">TOP</text>
        <g id="model"></g>
        <g id="snapLayer"></g>
      </svg>
      <div class="view-pad" id="viewPad" aria-label="View tools">
        <button data-view="north">N</button>
        <button data-view="top">Top</button>
        <button data-view="south">S</button>
        <button data-view="west">W</button>
        <button data-view="pv">PV</button>
        <button data-view="east">E</button>
      </div>
      <div class="axis">
        <button data-axis="x">X</button>
        <button data-axis="y">Y</button>
        <button data-axis="z">Z</button>
      </div>
    </section>

    <aside class="drawer open" id="drawer">
      <div class="drawer-head">
        <h2 id="drawerTitle">Create</h2>
        <button class="icon-btn" id="closeDrawer" aria-label="Close panel">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <footer class="bottom">
      <form class="command" id="commandForm">
        <input id="commandInput" autocomplete="off" value="select layer walls set color red" aria-label="Command input">
        <button class="primary">Run</button>
      </form>
      <nav class="tabs" aria-label="CAD categories">
        <button class="tab active" data-panel="think">Think</button>
        <button class="tab" data-panel="create">Create</button>
        <button class="tab" data-panel="select">Select</button>
        <button class="tab" data-panel="edit">Edit</button>
        <button class="tab" data-panel="view">View</button>
        <button class="tab" data-panel="layers">Layers</button>
        <button class="tab" data-panel="props">Props</button>
      </nav>
    </footer>
  </main>

  <script>
    const state = {
      activePanel: 'think',
      axisLock: null,
      viewMode: 'top',
      selectionMode: 'tap',
      snapMode: 'grid',
      gridSize: 24,
      lastSnap: null,
      runningSnaps: ['endpoint', 'midpoint', 'center'],
      activeReference: 'from point',
      selected: ['wall_north'],
      layers: [
        { id: 'walls', name: 'Walls', color: '#d95c4f', visible: true, locked: false },
        { id: 'floor', name: 'Floor', color: '#d6aa42', visible: true, locked: false },
        { id: 'guides', name: 'Guides', color: '#5aa8ff', visible: true, locked: true }
      ],
      groups: [
        { id: 'shell', name: 'Exterior Shell', count: 3 },
        { id: 'north', name: 'North Wall', count: 1 },
        { id: 'openings', name: 'Openings', count: 0 }
      ],
      recipes: [
        {
          name: 'Brick room',
          natural: 'Make a 12 by 16 foot brick room with 10 foot walls.',
          command: 'poly 0,0,0 12,0,0 12,16,0 0,16,0 close | extrude z 10 | set layer walls material brick | group selected as room_01'
        },
        {
          name: 'Revolved profile',
          natural: 'Make a stretched 24 node circle and revolve it around the Z axis.',
          command: 'circle center 0,0,0 radius 2 nodes 24 | select nodes top | move selected z 4 | revolve selected around z 360 segments 24'
        },
        {
          name: 'Move by reference',
          natural: 'Move selected objects from the endpoint of one line to the midpoint of another.',
          command: 'move selected from endpoint line_1 to midpoint line_2 lock xy'
        }
      ],
      objects: [
        { id: 'wall_north', type: 'line', layer: 'walls', group: 'North Wall', color: '#d95c4f', points: [[85,180],[305,180]], weight: 5, attrs: { material: 'brick', height: '10', phase: 'new' } },
        { id: 'wall_east', type: 'line', layer: 'walls', group: 'Exterior Shell', color: '#d95c4f', points: [[305,180],[305,370]], weight: 5, attrs: { material: 'brick', height: '10', phase: 'new' } },
        { id: 'floor_loop', type: 'poly', layer: 'floor', group: 'Exterior Shell', color: '#d6aa42', fill: 'rgba(214,170,66,.22)', points: [[85,180],[305,180],[305,370],[85,370]], weight: 2, attrs: { material: 'concrete', closed: 'true' } },
        { id: 'circle_24', type: 'circle24', layer: 'guides', group: 'Guides', color: '#5aa8ff', cx: 195, cy: 275, r: 58, weight: 2, attrs: { nodes: '24', role: 'profile' } }
      ]
    };

    const panels = {
      create: [
        ['Line', 'line from point to point'],
        ['Polyline', 'connected lines and loops'],
        ['Circle 24', 'editable 24-node circle'],
        ['Text', 'label with font attributes'],
        ['Face', 'fill a closed loop'],
        ['Revolve', 'spin profile around axis']
      ],
      edit: [
        ['Select', 'tap, window, by property'],
        ['Move', 'from point to point'],
        ['Copy', 'duplicate by reference'],
        ['Rotate', 'around axis or point'],
        ['Stretch', 'move nodes and edges'],
        ['Merge', 'join lines or loops'],
        ['Extrude', 'closed loop to volume'],
        ['Trim', 'cut against references'],
        ['Grid Snap', 'snap grid'],
        ['Free Snap', 'snap free'],
        ['Snap', 'endpoint midpoint center'],
        ['Reference', 'from point to point']
      ],
      select: [
        ['Tap Select', 'select mode tap'],
        ['Window', 'select mode window'],
        ['Crossing', 'select mode crossing'],
        ['Grid Snap', 'snap grid'],
        ['Free Pick', 'snap free'],
        ['Select All', 'select all'],
        ['Clear', 'select none'],
        ['Invert', 'select invert'],
        ['Walls', 'select layer walls'],
        ['Floor', 'select layer floor'],
        ['Guides', 'select layer guides'],
        ['Lines', 'select type line']
      ],
      view: [
        ['North', 'view north'],
        ['South', 'view south'],
        ['East', 'view east'],
        ['West', 'view west'],
        ['PV', 'view pv'],
        ['Top', 'view top']
      ]
    };

    const model = document.getElementById('model');
    const drawer = document.getElementById('drawer');
    const drawerBody = document.getElementById('drawerBody');
    const drawerTitle = document.getElementById('drawerTitle');
    const status = document.getElementById('status');
    const hud = document.getElementById('hud');
    const viewLabel = document.getElementById('viewLabel');
    const snapLayer = document.getElementById('snapLayer');

    function layerById(id) {
      return state.layers.find(layer => layer.id === id);
    }

    function renderModel() {
      model.innerHTML = '';
      model.setAttribute('transform', viewTransform());
      state.objects.forEach(object => {
        const layer = layerById(object.layer);
        if (!layer || !layer.visible) return;

        let node;
        if (object.type === 'poly') {
          node = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          node.setAttribute('points', object.points.map(point => point.join(',')).join(' '));
          node.setAttribute('fill', object.fill || 'transparent');
          node.setAttribute('stroke', object.color);
          node.setAttribute('stroke-width', object.weight);
        } else if (object.type === 'circle24') {
          const points = Array.from({ length: 24 }, (_, index) => {
            const angle = (Math.PI * 2 * index) / 24;
            return [object.cx + Math.cos(angle) * object.r, object.cy + Math.sin(angle) * object.r];
          });
          node = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          node.setAttribute('points', points.map(point => point.join(',')).join(' '));
          node.setAttribute('fill', 'transparent');
          node.setAttribute('stroke', object.color);
          node.setAttribute('stroke-width', object.weight);
          points.forEach((point, index) => {
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', point[0]);
            dot.setAttribute('cy', point[1]);
            dot.setAttribute('r', index % 6 === 0 ? 3.5 : 2.25);
            dot.setAttribute('fill', object.color);
            model.appendChild(dot);
          });
        } else {
          node = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          node.setAttribute('x1', object.points[0][0]);
          node.setAttribute('y1', object.points[0][1]);
          node.setAttribute('x2', object.points[1][0]);
          node.setAttribute('y2', object.points[1][1]);
          node.setAttribute('stroke', object.color);
          node.setAttribute('stroke-width', object.weight);
          node.setAttribute('stroke-linecap', 'round');
        }

        node.dataset.id = object.id;
        node.classList.toggle('selected', state.selected.includes(object.id));
        node.addEventListener('click', () => {
          state.selected = [object.id];
          renderAll();
        });
        model.appendChild(node);
      });
      renderSnapMarker();
    }

    function renderSnapMarker() {
      snapLayer.innerHTML = '';
      if (!state.lastSnap) return;
      const { x, y } = state.lastSnap;
      snapLayer.innerHTML = `
        <path class="snap-marker" d="M ${x - 8} ${y} L ${x + 8} ${y} M ${x} ${y - 8} L ${x} ${y + 8}"></path>
        <circle class="snap-marker" cx="${x}" cy="${y}" r="10"></circle>
        <text class="snap-text" x="${x + 12}" y="${y - 12}">${x},${y}</text>
      `;
    }

    function viewTransform() {
      if (state.viewMode === 'north') return 'translate(0 18) scale(1 .82)';
      if (state.viewMode === 'south') return 'rotate(180 195 310) translate(0 18) scale(1 .82)';
      if (state.viewMode === 'east') return 'rotate(90 195 310) translate(0 18) scale(1 .82)';
      if (state.viewMode === 'west') return 'rotate(-90 195 310) translate(0 18) scale(1 .82)';
      if (state.viewMode === 'pv') return 'translate(32 -18) skewX(-12) scale(.88 .76)';
      return '';
    }

    function renderHud() {
      const selectedText = `${state.selected.length} selected`;
      const axisText = state.axisLock ? `Lock ${state.axisLock.toUpperCase()}` : 'Free XYZ';
      hud.innerHTML = [
        selectedText,
        axisText,
        `Snap ${state.snapMode}`,
        `Snap ${state.runningSnaps.join('/')}`,
        `Select ${state.selectionMode}`,
        state.activeReference,
        `View ${state.viewMode.toUpperCase()}`
      ].map(text => `<span class="chip">${text}</span>`).join('');
      status.textContent = `${state.objects.length} objects - ${selectedText}`;
      viewLabel.textContent = state.viewMode === 'pv' ? 'PERSPECTIVE' : state.viewMode.toUpperCase();
    }

    function commandButton(label, hint) {
      return `<button class="tool" data-command="${hint}">${label}<span>${hint}</span></button>`;
    }

    function renderDrawer() {
      drawerTitle.textContent = state.activePanel[0].toUpperCase() + state.activePanel.slice(1);

      if (state.activePanel === 'layers') {
        drawerBody.innerHTML = state.layers.map(layer => `
          <div class="row">
            <span class="swatch" style="background:${layer.color}"></span>
            <div class="name">${layer.name}<div class="meta">${layer.visible ? 'visible' : 'hidden'} · ${layer.locked ? 'locked' : 'editable'}</div></div>
            <button class="pill" data-layer="${layer.id}">${layer.visible ? 'Hide' : 'Show'}</button>
          </div>
        `).join('') + commandButton('New Layer', 'layer new name color');
        return;
      }

      if (state.activePanel === 'groups') {
        drawerBody.innerHTML = state.groups.map(group => `
          <div class="row">
            <span class="swatch" style="background:#24b47e"></span>
            <div class="name">${group.name}<div class="meta">${group.count} objects</div></div>
            <button class="pill" data-command="select group ${group.name}">Select</button>
          </div>
        `).join('') + commandButton('Group Selected', 'group selected as name');
        return;
      }

      if (state.activePanel === 'think') {
        drawerBody.innerHTML = `
          <div class="properties">
            <div class="field">
              <label>Natural description</label>
              <input id="naturalInput" value="${state.recipes[0].natural}">
            </div>
            <button class="tool" data-describe="true">Generate command chain<span>turn description into editable CAD steps</span></button>
            ${state.recipes.map(recipe => `
              <div class="row">
                <span class="swatch" style="background:#24b47e"></span>
                <div class="name">${recipe.name}<div class="meta">${recipe.command}</div></div>
                <button class="pill" data-recipe="${recipe.name}">Use</button>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      if (state.activePanel === 'props') {
        const object = state.objects.find(item => item.id === state.selected[0]) || state.objects[0];
        drawerBody.innerHTML = `
          <div class="properties">
            <div class="field"><label>Object</label><input value="${object.id}"></div>
            <div class="field"><label>Layer</label><select>${state.layers.map(layer => `<option ${layer.id === object.layer ? 'selected' : ''}>${layer.name}</option>`).join('')}</select></div>
            <div class="field"><label>Line color</label><input value="${object.color}"></div>
            <div class="field"><label>Fill / material</label><input value="${object.attrs.material || object.fill || ''}"></div>
            <div class="field"><label>Attributes</label><input value="${Object.entries(object.attrs).map(([key, value]) => `${key}=${value}`).join(', ')}"></div>
          </div>
        `;
        return;
      }

      drawerBody.innerHTML = `<div class="grid">${panels[state.activePanel].map(item => commandButton(item[0], item[1])).join('')}</div>`;
    }

    function selectBy(predicate) {
      state.selected = state.objects.filter(predicate).map(object => object.id);
    }

    function setView(mode) {
      state.viewMode = mode;
    }

    function runCommand(command) {
      const text = command.trim().toLowerCase();
      if (!text) return;
      if (text.includes('select all')) {
        state.selected = state.objects.map(object => object.id);
      }
      if (text.includes('select none') || text.includes('clear selection')) {
        state.selected = [];
      }
      if (text.includes('select invert')) {
        state.selected = state.objects.filter(object => !state.selected.includes(object.id)).map(object => object.id);
      }
      if (text.includes('select layer walls')) {
        selectBy(object => object.layer === 'walls');
      }
      if (text.includes('select layer floor')) {
        selectBy(object => object.layer === 'floor');
      }
      if (text.includes('select layer guides')) {
        selectBy(object => object.layer === 'guides');
      }
      if (text.includes('select type line')) {
        selectBy(object => object.type === 'line');
      }
      if (text.includes('select mode tap')) {
        state.selectionMode = 'tap';
      }
      if (text.includes('select mode window')) {
        state.selectionMode = 'window';
      }
      if (text.includes('select mode crossing')) {
        state.selectionMode = 'crossing';
      }
      if (text.includes('set color red')) {
        state.objects.forEach(object => {
          if (state.selected.includes(object.id)) object.color = '#e45d5d';
        });
      }
      if (text.includes('set color blue')) {
        state.objects.forEach(object => {
          if (state.selected.includes(object.id)) object.color = '#5aa8ff';
        });
      }
      if (text.includes('group selected')) {
        state.groups.unshift({ id: `group_${Date.now()}`, name: 'Command Group', count: state.selected.length });
      }
      if (text.includes('move') && text.includes('z')) {
        hud.insertAdjacentHTML('beforeend', '<span class="chip">Z move queued</span>');
      }
      if (text.includes('snap endpoint')) {
        state.runningSnaps = ['endpoint'];
      }
      if (text.includes('snap midpoint')) {
        state.runningSnaps = ['midpoint'];
      }
      if (text.includes('snap grid')) {
        state.snapMode = 'grid';
      }
      if (text.includes('snap free') || text.includes('free pick')) {
        state.snapMode = 'free';
      }
      if (text.includes('from endpoint')) {
        state.activeReference = 'from endpoint';
      }
      if (text.includes('to midpoint')) {
        state.activeReference = `${state.activeReference} to midpoint`;
      }
      ['north', 'south', 'east', 'west', 'pv', 'top'].forEach(mode => {
        if (text.includes(`view ${mode}`)) setView(mode);
      });
      renderAll();
    }

    function svgPointFromEvent(event) {
      const svg = event.currentTarget.querySelector('svg');
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(svg.getScreenCTM().inverse());
    }

    function snapPoint(point) {
      if (state.snapMode !== 'grid') return { x: Math.round(point.x), y: Math.round(point.y) };
      return {
        x: Math.round(point.x / state.gridSize) * state.gridSize,
        y: Math.round(point.y / state.gridSize) * state.gridSize
      };
    }

    function renderAll() {
      renderModel();
      renderHud();
      renderDrawer();
      document.querySelectorAll('.axis button').forEach(button => {
        button.classList.toggle('active', state.axisLock === button.dataset.axis);
      });
      document.querySelectorAll('.view-pad button').forEach(button => {
        button.classList.toggle('active', state.viewMode === button.dataset.view);
      });
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', state.activePanel === tab.dataset.panel);
      });
    }

    document.querySelector('.tabs').addEventListener('click', event => {
      const tab = event.target.closest('.tab');
      if (!tab) return;
      state.activePanel = tab.dataset.panel;
      drawer.classList.add('open');
      renderAll();
    });

    drawerBody.addEventListener('click', event => {
      const command = event.target.closest('[data-command]')?.dataset.command;
      const layerId = event.target.closest('[data-layer]')?.dataset.layer;
      const recipeName = event.target.closest('[data-recipe]')?.dataset.recipe;
      const describe = event.target.closest('[data-describe]');
      if (command) {
        document.getElementById('commandInput').value = command;
      }
      if (recipeName) {
        const recipe = state.recipes.find(item => item.name === recipeName);
        document.getElementById('commandInput').value = recipe.command;
      }
      if (describe) {
        const value = document.getElementById('naturalInput').value.toLowerCase();
        let commandChain = 'select all';
        if (value.includes('room')) commandChain = state.recipes[0].command;
        if (value.includes('circle') || value.includes('revolve')) commandChain = state.recipes[1].command;
        if (value.includes('move') || value.includes('point')) commandChain = state.recipes[2].command;
        document.getElementById('commandInput').value = commandChain;
      }
      if (layerId) {
        const layer = layerById(layerId);
        layer.visible = !layer.visible;
        renderAll();
      }
    });

    document.querySelector('.axis').addEventListener('click', event => {
      const axis = event.target.dataset.axis;
      if (!axis) return;
      state.axisLock = state.axisLock === axis ? null : axis;
      renderAll();
    });

    document.getElementById('viewPad').addEventListener('click', event => {
      const view = event.target.dataset.view;
      if (!view) return;
      setView(view);
      renderAll();
    });

    document.getElementById('workspace').addEventListener('pointerdown', event => {
      if (event.target.closest('button')) return;
      const point = snapPoint(svgPointFromEvent(event));
      state.lastSnap = point;
      document.getElementById('commandInput').value = `point ${point.x},${point.y},0 snap ${state.snapMode}`;
      renderAll();
    });

    document.getElementById('commandForm').addEventListener('submit', event => {
      event.preventDefault();
      runCommand(document.getElementById('commandInput').value);
    });

    document.getElementById('menuBtn').addEventListener('click', () => drawer.classList.toggle('open'));
    document.getElementById('closeDrawer').addEventListener('click', () => drawer.classList.remove('open'));
    document.getElementById('saveBtn').addEventListener('click', () => {
      localStorage.setItem('drawvision-model', JSON.stringify(state));
      status.textContent = 'Saved locally';
    });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js');
    }

    renderAll();
  </script>
</body>
</html>
